name: OlazIOS
options:
  bundleIdPrefix: app.olaz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Olaz:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/OlazIOS
        excludes:
          - Info.plist
      - path: Sources/Olaz/JSBridge
      - path: Sources/Olaz/ZaloRuntime
      - path: Sources/Olaz/Models.swift
      - path: Sources/Olaz/Theme.swift
      - path: Sources/Olaz/HostScripts
        type: folder
        buildPhase: resources
      - path: Sources/Olaz/JSModules
        type: folder
        buildPhase: resources
      - path: build/AppResources
        type: folder
        buildPhase: resources
      - path: build/ZaloRuntime
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Olaz
        PRODUCT_MODULE_NAME: Olaz
        PRODUCT_BUNDLE_IDENTIFIER: app.olaz.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        VALID_ARCHS: arm64
        SUPPORTED_PLATFORMS: iphoneos
        INFOPLIST_FILE: Sources/OlazIOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEAD_CODE_STRIPPING: YES
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/FingerprintHelper/build/ios-arm64/libolazfp.a"
          - "-lsqlite3"
          - "-lresolv"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "Security"
